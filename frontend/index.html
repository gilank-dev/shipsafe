                  "@type": "Answer",
                  "text": "Vibe coding security refers to auditing and securing software written with AI assistants such as Cursor, Claude Code, GitHub Copilot, or Windsurf. Because AI agents often generate code with hardcoded credentials, permissive wildcard CORS policies, or unvalidated user inputs, ShipSafe acts as a pre-flight security gatekeeper to detect and fix vulnerabilities before code reaches production."

                }
              },

                "@type": "Question",
                "name": "Does ShipSafe execute or run uploaded codebase files?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. ShipSafe enforces a strict zero-execution policy. Code is never built, compiled, or executed. ZIP archives are decompressed inside an isolated sandbox with zip-slip and bomb protection, statically inspected, and wiped immediately upon audit completion."
                }
              },
              {
                "@type": "Question",
                "name": "How do I fix security findings with Cursor, Claude Code, or GitHub Copilot?",
